[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend"]
omit = [
  "backend/seed.py",
  "backend/services/content_moderator.py",
  "backend/services/ai_image_detector.py"
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true
