# Render.com Blueprint - Deploy Smart Grievance System
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-grievance-system
    runtime: python
    region: oregon
    plan: free

    # Build and startup
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT

    # Environment
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-grievance-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DEMO_EMAIL_MODE
        value: "false"
      - key: DEMO_SMS_MODE
        value: "false"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ENABLE_STARTUP_MODEL_LOAD
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCHEDULER_AUTOSTART
        value: "false"
      - key: ENABLE_SCHEDULED_RETRAIN
        value: "true"
      - key: ML_AUTO_ASSIGN_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: ML_MANUAL_REVIEW_DEPARTMENT
        value: Manual Review Queue

    # Health check
    healthCheckPath: /health

databases:
  - name: smart-grievance-db
    databaseName: smart_grievance
    user: smart_grievance
    plan: free
