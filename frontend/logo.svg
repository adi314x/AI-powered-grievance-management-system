<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer shield -->
  <path d="M100 8 L180 40 L180 110 C180 152 144 186 100 196 C56 186 20 152 20 110 L20 40 Z"
        fill="url(#shieldGrad)" />

  <!-- Inner shield highlight -->
  <path d="M100 22 L166 50 L166 110 C166 144 137 172 100 182 C63 172 34 144 34 110 L34 50 Z"
        fill="url(#innerGrad)" opacity="0.25"/>

  <!-- Checkmark / tick -->
  <path d="M62 102 L88 128 L140 76" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- India flag tricolor strip at bottom of shield -->
  <clipPath id="shieldClip">
    <path d="M100 8 L180 40 L180 110 C180 152 144 186 100 196 C56 186 20 152 20 110 L20 40 Z"/>
  </clipPath>
  <rect x="20" y="168" width="160" height="10" fill="#FF9933" clip-path="url(#shieldClip)" opacity="0.9"/>
  <rect x="20" y="178" width="160" height="10" fill="white"   clip-path="url(#shieldClip)" opacity="0.6"/>
  <rect x="20" y="188" width="160" height="10" fill="#138808" clip-path="url(#shieldClip)" opacity="0.9"/>

  <defs>
    <linearGradient id="shieldGrad" x1="100" y1="8" x2="100" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="100" y1="22" x2="100" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
