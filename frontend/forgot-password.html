<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Grievance System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="government-portal-theme.css">
    <link rel="stylesheet" href="improved-contrast.css">
    <style>
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #D1D5DB;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .otp-input:focus {
            outline: none;
            border-color: #003DA5;
            box-shadow: 0 0 0 3px rgba(0, 61, 165, 0.1);
        }
        .timer {
            text-align: center;
            color: #6B7280;
            margin: 10px 0;
            font-size: 14px;
        }
        .timer.expired {
            color: #EF4444;
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .progress-step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .progress-step::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            right: -50%;
            height: 2px;
            background: #E5E7EB;
            z-index: -1;
        }
        .progress-step:last-child::before {
            display: none;
        }
        .progress-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #E5E7EB;
            color: #6B7280;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .progress-step.active .progress-circle {
            background: #003DA5;
            color: white;
        }
        .progress-step.completed .progress-circle {
            background: #10B981;
            color: white;
        }
        .progress-label {
            font-size: 12px;
            color: #6B7280;
        }
        .progress-step.active .progress-label {
            color: #003DA5;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="department-backgrounds.css">
</head>
<body>
    <header class="header">
        <div class="header-main">
            <div class="container">
                <div class="header-content">
                    <h1 data-translate="app_name">🇮🇳 Smart Grievance System</h1>
                    <div class="header-actions">
                        <a href="login.html" class="btn btn-secondary" style="text-decoration: none;" data-translate="back_to_login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 500px; margin-top: 2rem;">
        <div class="card">
            <h2 class="card-title" data-translate="reset_password">Reset Password</h2>
            
            <!-- Progress Steps -->
            <div class="progress-steps">
                <div class="progress-step active" id="progress-step-1">
                    <div class="progress-circle">1</div>
                    <div class="progress-label" data-translate="email_step">Email</div>
                </div>
                <div class="progress-step" id="progress-step-2">
                    <div class="progress-circle">2</div>
                    <div class="progress-label" data-translate="verify_step">Verify</div>
                </div>
                <div class="progress-step" id="progress-step-3">
                    <div class="progress-circle">3</div>
                    <div class="progress-label" data-translate="new_password_step">New Password</div>
                </div>
            </div>

            <!-- Step 1: Enter Email -->
            <div id="step1" class="step active">
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;" data-translate="reset_password_desc">
                    Enter your registered email address to receive a verification code
                </p>
                
                <form id="emailForm">
                    <div class="form-group">
                        <label class="form-label" for="email" data-translate="email_address">Email Address</label>
                        <input type="email" id="email" class="form-input" 
                               data-translate="enter_registered_email" placeholder="Enter your registered email" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;" data-translate="send_verification_code">
                        Send Verification Code
                    </button>
                </form>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="step2" class="step">
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 0.5rem;" data-translate="enter_verification_code">
                    Enter the 6-digit code sent to:
                </p>
                <p style="text-align: center; font-weight: 600; margin-bottom: 1.5rem;" id="emailDisplay"></p>
                
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-input" id="otp1" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" id="otp2" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" id="otp3" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" id="otp4" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" id="otp5" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" id="otp6" autocomplete="off">
                </div>
                
                <div class="timer" id="timer">Time remaining: 05:00</div>
                
                <button id="verifyOtpBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" data-translate="verify_code">
                    Verify Code
                </button>
                
                <div style="text-align: center;">
                    <button id="resendOtpBtn" class="btn btn-secondary" style="font-size: 14px;" data-translate="resend_code">
                        Resend Code
                    </button>
                </div>
            </div>

            <!-- Step 3: Set New Password -->
            <div id="step3" class="step">
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;" data-translate="create_new_password_desc">
                    Create a strong new password for your account
                </p>
                
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="newPassword" data-translate="new_password">New Password</label>
                        <input type="password" id="newPassword" class="form-input" 
                               data-translate="enter_new_password" placeholder="Enter new password (min 8 characters)" required minlength="8">
                        <small style="color: var(--text-secondary);" data-translate="password_requirements">
                            Must be at least 8 characters long
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword" data-translate="confirm_password">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-input" 
                               data-translate="reenter_new_password" placeholder="Re-enter new password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;" data-translate="reset_password_btn">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="runtime-config.js"></script>
    <script src="app.js"></script>
    <script src="language-config.js"></script>
    <script src="translations.js"></script>
    <script>
        let currentEmail = '';
        let resetToken = '';
        let timerInterval = null;
        let timeRemaining = 300; // 5 minutes

        // Step 1: Send verification code
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                const data = await apiCall('/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                
                currentEmail = email;
                document.getElementById('emailDisplay').textContent = email;
                
                showAlert('✅ Verification code sent to your email', 'success');
                
                // Move to step 2
                goToStep(2);
                startTimer();
                
                // Auto-focus first OTP input
                document.getElementById('otp1').focus();
                
            } catch (error) {
                showAlert('❌ ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Verification Code';
            }
        });

        // OTP input handling
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            // Only allow numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Step 2: Verify OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const otp = Array.from(otpInputs).map(input => input.value).join('');
            
            if (otp.length !== 6) {
                showAlert('❌ Please enter all 6 digits', 'error');
                return;
            }
            
            const verifyBtn = document.getElementById('verifyOtpBtn');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            
            try {
                const data = await apiCall('/auth/verify-reset-otp', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: currentEmail,
                        otp: otp
                    })
                });
                
                resetToken = data.reset_token;
                
                showAlert('✅ Code verified successfully!', 'success');
                
                // Stop timer
                clearInterval(timerInterval);
                
                // Move to step 3
                goToStep(3);
                
            } catch (error) {
                showAlert('❌ ' + error.message, 'error');
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Code';
            }
        });

        // Resend OTP
        document.getElementById('resendOtpBtn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';
            
            try {
                await apiCall('/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email: currentEmail })
                });
                
                showAlert('✅ New code sent to your email', 'success');
                
                // Clear OTP inputs
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
                
                // Restart timer
                clearInterval(timerInterval);
                timeRemaining = 300;
                startTimer();
                
            } catch (error) {
                showAlert('❌ ' + error.message, 'error');
            } finally {
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Code';
            }
        });

        // Step 3: Reset password
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('❌ Passwords do not match', 'error');
                return;
            }
            
            if (newPassword.length < 8) {
                showAlert('❌ Password must be at least 8 characters long', 'error');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';
            
            try {
                await apiCall('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        reset_token: resetToken,
                        new_password: newPassword
                    })
                });
                
                showAlert('✅ Password reset successfully! Redirecting to login...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                showAlert('❌ ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        // Helper functions
        function goToStep(stepNumber) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            
            // Show current step
            document.getElementById('step' + stepNumber).classList.add('active');
            
            // Update progress
            for (let i = 1; i <= 3; i++) {
                const progressStep = document.getElementById('progress-step-' + i);
                progressStep.classList.remove('active', 'completed');
                
                if (i < stepNumber) {
                    progressStep.classList.add('completed');
                } else if (i === stepNumber) {
                    progressStep.classList.add('active');
                }
            }
        }

        function startTimer() {
            const timerElement = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                
                timerElement.textContent = `Time remaining: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerElement.textContent = 'Code expired. Please request a new one.';
                    timerElement.classList.add('expired');
                    document.getElementById('verifyOtpBtn').disabled = true;
                }
            }, 1000);
        }
    </script>
    <script src="government-portal-init.js"></script>
    <script src="simple-translator.js"></script>
    <script src="language-selector-widget.js"></script>
</body>
</html>
